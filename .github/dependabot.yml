version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Keep lockstep packages together so major bumps don't arrive as
      # individually broken PRs.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      minor-and-patch:
        # Dependabot is documented to put a dependency in the first group it
        # matches, but a pattern-less catch-all wins in practice
        # (dependabot-core#9765) — @vitest/coverage-v8 landed here while vitest
        # went to the group above, and the half-updated lockfile broke npm ci.
        # exclude-patterns is the reliable way to keep the lockstep set out.
        exclude-patterns:
          - vitest
          - '@vitest/*'
        update-types:
          - minor
          - patch
  # The documentation site has its own manifest so its toolchain never lands in
  # the runtime image or the test matrix.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs:
        patterns:
          - '*'
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze are separate dependencies to Dependabot but must
      # always move together.
      codeql:
        patterns:
          - github/codeql-action*
