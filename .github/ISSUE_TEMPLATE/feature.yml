name: Feature request
description: Something the hub should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or workflow, not yet the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should the hub do?
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Affected client or ecosystem (if any)
      placeholder: "ChatGPT connectors, Gemini Enterprise, Copilot Studio, …"
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you considered
