name: Dependabot auto-merge

# Queues low-risk Dependabot updates for merge once CI is green, so routine
# patch bumps of direct development dependencies do not need a manual click.
#
# Safety rests on two things:
#   * `main` requires the CI checks, so `--auto` waits for tests, CodeQL and
#     the Trivy container scan instead of merging immediately.
#   * The condition is written positively: only updates Dependabot explicitly
#     labels as a patch to a direct development dependency are queued. Runtime,
#     transitive, minor, major and unclassified updates remain manual.
#
# /docs is excluded on purpose. Its build runs in docs.yml, which is path
# filtered and therefore cannot be a required check on every PR — so auto-merge
# would not wait for it, and a bad VitePress bump could reach the published
# site unseen. That is one PR a week at most; it can have a human look.

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Queue for merge
        if: |
          steps.metadata.outputs.directory == '/' &&
          steps.metadata.outputs.dependency-type == 'direct:development' &&
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
