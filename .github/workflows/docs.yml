name: Docs

# Builds the VitePress site under docs/ and publishes it to the gh-pages
# branch, which GitHub Pages serves at https://mcp-hub.ni-c.de.
# Pull requests build only, so a broken page cannot reach the branch.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      # Needed only by the deploy step, which force-pushes the built site.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # VitePress reads the last-modified timestamp of every page from the
          # git history, which a shallow clone does not have.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs

      # Publish without a third-party action: one orphan commit force-pushed to
      # gh-pages keeps the branch a single revision and adds no supply-chain
      # surface. public/CNAME and public/.nojekyll are part of the build output,
      # so the custom domain survives every deploy.
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        working-directory: docs/.vitepress/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f CNAME
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "docs: build from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
