name: Docs

# Builds the VitePress site under docs/ and publishes it to the gh-pages
# branch, which GitHub Pages serves at https://mcp-hub.ni-c.de.
# Pull requests build only, so a broken page cannot reach the branch.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      # The nav version is read from here at build time.
      - 'package.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'package.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # VitePress reads the last-modified timestamp of every page from the
          # git history, which a shallow clone does not have.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: docs
      - run: npm run build
        working-directory: docs

      # Every release in CHANGELOG.md must reach the rendered page. VitePress does
      # not fail the build when the @include produces nothing, and it silently falls
      # back to the whole file when a region name stops matching — so check the
      # result, per version, against the heading anchors VitePress derives from them.
      # It runs here rather than in deploy: only this job has the repository, and a
      # broken page should not become an artifact in the first place.
      - name: Check every release reaches the changelog page
        run: |
          page=docs/.vitepress/dist/reference/changelog.html
          missing=""
          for v in $(grep -oE '^## \[[0-9][^]]*\]' CHANGELOG.md | tr -d '#[] '); do
            grep -q "id=\"_$(echo "$v" | tr . -)" "$page" || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Missing from $page:$missing" >&2
            echo "The '#region changelog' include in CHANGELOG.md is broken." >&2
            exit 1
          fi
          echo "changelog page carries all $(grep -cE '^## \[' CHANGELOG.md) releases"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: docs/.vitepress/dist
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site
          path: site
      # One orphan commit keeps gh-pages at a single revision. Only this job has
      # write permission; the build runs with the workflow's read-only default.
      - name: Publish to gh-pages
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f CNAME
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "docs: build from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
