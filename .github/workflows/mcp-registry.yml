name: Publish to MCP Registry

# Manual fallback: re-publish the current package version to the MCP registry,
# e.g. after a failed registry job in a release run (re-running that job would
# check out the immutable tag). The npm package and the GHCR image for the
# version in package.json must already be published.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for MCP registry OIDC authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync version from package.json into server.json
        run: |
          version="$(node -p "require('./package.json').version")"
          # The registry rejects a 'version' field on OCI packages — their
          # version lives in the identifier tag instead.
          jq --arg v "$version" \
            '.version = $v
             | (.packages[] | select(.registryType != "oci") | .version) = $v
             | (.packages[] | select(.registryType == "oci")) |= (del(.version) | .identifier |= sub(":[^:]*$"; ":" + $v))' \
            server.json > server.tmp && mv server.tmp server.json
          jq -r '.packages[] | "\(.registryType) \(.identifier) \(.version // "-")"' server.json
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz
          echo 'ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  mcp-publisher.tar.gz' | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
