name: Release

on:
  push:
    tags: ['v*.*.*']

# A tag push that is delivered twice (or a tag that is moved) would otherwise
# run two releases side by side, and the loser dies on npm's "cannot publish
# over the previously published version" — a permanently red check on a commit
# that is also main's HEAD. Unlike ci.yml this must not cancel the running one:
# killing a release between the npm publish and the registry sync leaves the
# release half done.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate tag, package version and main ancestry
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # OIDC token for npm Trusted Publishing — no NPM_TOKEN secret involved.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 ships npm >= 11.5.1, required for Trusted Publishing.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches the package version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      # Idempotent: a re-run of a release whose publish already went through
      # (or a duplicate tag delivery that slipped past the concurrency group)
      # must not turn red on npm's 403 for an existing version.
      - name: Publish to npm unless the version is already there
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@ni-c/mcp-hub@$version" version > /dev/null 2>&1; then
            echo "@ni-c/mcp-hub@$version is already published — skipping"
            exit 0
          fi
          npm publish --provenance

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for MCP registry OIDC authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync version from package.json into server.json
        run: |
          version="$(node -p "require('./package.json').version")"
          # The registry rejects a 'version' field on OCI packages — their
          # version lives in the identifier tag instead.
          jq --arg v "$version" \
            '.version = $v
             | (.packages[] | select(.registryType != "oci") | .version) = $v
             | (.packages[] | select(.registryType == "oci")) |= (del(.version) | .identifier |= sub(":[^:]*$"; ":" + $v))' \
            server.json > server.tmp && mv server.tmp server.json
          jq -r '.packages[] | "\(.registryType) \(.identifier) \(.version // "-")"' server.json
      # Same idempotency as the npm and GitHub-release steps: the registry
      # answers a version it already has with "cannot publish duplicate
      # version", so a re-run that only needs the other half would fail here.
      - name: Check whether the registry already has this version
        id: registry
        run: |
          version="$(node -p "require('./package.json').version")"
          if body="$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.ni-c/mcp-hub&version=$version")"; then
            # search is fuzzy, so match the name exactly rather than trusting the hit.
            if jq -e --arg v "$version" \
                '[.servers[].server | select(.name == "io.github.ni-c/mcp-hub" and .version == $v)] | length > 0' \
                <<<"$body" > /dev/null; then
              echo "io.github.ni-c/mcp-hub@$version is already in the registry — skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # A failed query must never look like "already published" — publish
            # and let the attempt itself report the problem.
            echo "registry query failed — publishing anyway"
          fi
      # The OCI image is pushed by ci.yml's publish job, which runs in parallel
      # to this workflow on the same tag — the registry's ownership check would
      # race it. Wait until GHCR actually serves the version tag.
      - name: Wait for the GHCR image tag
        if: steps.registry.outputs.skip != 'true'
        run: |
          version="$(node -p "require('./package.json').version")"
          token="$(curl -fsS 'https://ghcr.io/token?scope=repository:ni-c/mcp-hub:pull&service=ghcr.io' | jq -r .token)"
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                "https://ghcr.io/v2/ni-c/mcp-hub/manifests/$version"; then
              echo "ghcr.io/ni-c/mcp-hub:$version is available"
              exit 0
            fi
            echo "waiting for ghcr.io/ni-c/mcp-hub:$version ($i/60)"
            sleep 30
          done
          echo "Image tag $version never appeared on GHCR — is ci.yml's publish job green?" >&2
          exit 1
      - name: Install mcp-publisher
        if: steps.registry.outputs.skip != 'true'
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz
          echo 'ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  mcp-publisher.tar.gz' | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - if: steps.registry.outputs.skip != 'true'
        run: ./mcp-publisher login github-oidc
      - if: steps.registry.outputs.skip != 'true'
        run: ./mcp-publisher publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" \
            '$0 ~ "^## \\[" ver "\\]" {flag=1; next} /^## \[/ {flag=0} flag' \
            CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "No CHANGELOG section found for $version" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same reasoning as the npm step: creating an existing release is an
          # error, and a re-run must be able to finish the missing half.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
