services:
  mcp-hub:
    build: .
    image: mcp-hub:local
    container_name: mcp-hub
    mem_limit: 1g
    read_only: true
    restart: unless-stopped

    ports:
      # Bind to the interface your reverse proxy reaches; localhost if it runs
      # on the same host.
      - "127.0.0.1:7690:80"

    environment:
      # Public URL as seen by clients (TLS terminated by the reverse proxy).
      EXTERNAL_URL: "https://mcp.example.net"

      # Networks allowed to set X-Forwarded-* (your reverse proxy).
      TRUSTED_PROXIES: "192.168.1.0/24"

      # Access tokens are bound to /hub or one /<name>/mcp resource by
      # default. RESOURCE_BOUND_TOKENS: "false" restores the pre-0.5 behaviour
      # for a migration period; it is not something to keep.

      MCP_BODY_LIMIT: "1mb"
      MCP_REQUESTS_PER_MINUTE: "120"
      MCP_MAX_CONCURRENT_REQUESTS: "4"

      # bcrypt hash of the OAuth login password. Generate with:
      #   htpasswd -bnBC 10 "" 'yourpassword' | tr -d ':\n'
      # (PASSWORD with a plain-text value works too, PASSWORD_HASH wins.)
      PASSWORD_HASH: "${PASSWORD_HASH}"

      # Secrets referenced as ${VAR} in mcp.json, provided via .env:
      PAPERLESS_API_TOKEN: "${PAPERLESS_API_TOKEN}"

      # Only needed for `type: "docker"` servers, and note what it points at:
      # the policy proxy below, never /var/run/docker.sock. The daemon API is
      # root-equivalent and this container faces the internet.
      # DOCKER_HOST: "unix:///run/proxy/docker.sock" # required; direct daemon access is refused

    volumes:
      - "./mcp.json:/config/mcp.json:ro"
      # JWT key + OAuth client registrations + refresh tokens. Must survive
      # container recreates, otherwise every connector must re-authorize.
      # The container runs as uid 1000 (non-root), so chown this dir to match:
      #   mkdir -p data && sudo chown -R 1000:1000 data
      - "./data:/data"
      # - "proxy-sock:/run/proxy"

    pids_limit: 300

    # Child servers should not need a writable image. Put deliberate persistent
    # child state under /data; transient caches belong in these tmpfs mounts.
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /home/node/.cache:size=128m,mode=0700,uid=1000,gid=1000

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

  # Uncomment together with the DOCKER_HOST line above to run servers in their
  # own containers (`type: "docker"`). See https://mcp-hub.ni-c.de/guide/sandboxing
  #
  # This is the only container that gets the Docker socket. It reads the same
  # mcp.json, read-only, and allows exactly the container operations that file
  # describes: nothing privileged, no host mounts, no other images.
  #
  # docker-proxy:
  #   image: ghcr.io/ni-c/mcp-hub-docker-proxy:<version>@sha256:<digest>
  #   container_name: mcp-hub-docker-proxy
  #   restart: unless-stopped
  #   group_add: ["999"]            # `getent group docker`
  #   read_only: true
  #   cap_drop: [ALL]
  #   security_opt:
  #     - no-new-privileges:true
  #   volumes:
  #     - "./mcp.json:/config/mcp.json:ro"
  #     # Credentials for sandboxed servers ("secretsFrom"), chmod 640, regular
  #     # non-symlink files, at most 64 KiB and 100 unique variables. They are
  #     # added to the container after the request is validated, so the hub
  #     # process never holds them.
  #     - "./secrets:/run/secrets:ro"
  #     - "/var/run/docker.sock:/var/run/docker.sock"
  #     - "proxy-sock:/run/proxy"

# volumes:
#   proxy-sock:

networks:
  default:
    name: mcp-net
    external: true
